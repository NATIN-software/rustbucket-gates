            status=refused
            findings=1
          fi
          if [ -n "${PROBE_ERROR_MARKER:-}" ] && [ -f "project/probe/$PROBE_ERROR_MARKER" ]; then
            status=error
          fi
          if [ -n "${PROBE_HANG_MARKER:-}" ] && [ -f "project/probe/$PROBE_HANG_MARKER" ]; then
            printf 'RUSTBUCKET-PROBE-NOTE {"note":"hang marker present: sleeping past the job timeout"}\n'
            sleep 600
          fi

          printf 'RUSTBUCKET-GATE-RESULT {"v":1,"gate":"probe-%s","job":%s,"status":%s,"findings":%s,"truncated":false,"gates_commit":%s}\n' \

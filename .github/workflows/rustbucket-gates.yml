    name: gates-test
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 2
          persist-credentials: false
      - name: Check out gates (V2 probe)
        id: gates
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NATIN-software/rustbucket-gates
          ref: ${{ github.workflow_sha }}
          path: gates
          persist-credentials: false
      - name: Probe
        shell: bash
        env:
          PROBE_JOB: gates-test
          PROBE_MARKER: fail-test
          PROBE_HANG_MARKER: hang-test
          CTX_WORKFLOW_REF: ${{ github.workflow_ref }}
          CTX_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CTX_REPOSITORY: ${{ github.repository }}
          CTX_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CTX_SHA: ${{ github.sha }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          set +e
          esc() {
            local s=$1
            s=${s//\\/\\\\}
            s=${s//\"/\\\"}
            printf '%s' "$s"
          }

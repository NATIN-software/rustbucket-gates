  rustbucket-gates:
    name: rustbucket-gates
    needs: [gates-static, gates-lint, gates-test]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Aggregate
        shell: bash
        env:
          R_STATIC: ${{ needs.gates-static.result }}
          R_LINT: ${{ needs.gates-lint.result }}
          R_TEST: ${{ needs.gates-test.result }}
        run: |
          set +e
          esc() {
            local s=$1
            s=${s//\\/\\\\}
            s=${s//\"/\\\"}
            printf '%s' "$s"
          }
          status=pass
          for r in "$R_STATIC" "$R_LINT" "$R_TEST"; do
            [ "$r" = success ] || status=refused
          done
          printf 'RUSTBUCKET-GATE-RESULT {"v":1,"gate":"aggregate","job":"rustbucket-gates","status":"%s","needs":{"gates-static":"%s","gates-lint":"%s","gates-test":"%s"}}\n' \
            "$status" "$(esc "$R_STATIC")" "$(esc "$R_LINT")" "$(esc "$R_TEST")"
          [ "$status" = pass ]

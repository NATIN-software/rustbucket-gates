            fi
          }

          gates_head=""
          gates_has_workflow=false
          if [ -d gates ]; then
            gates_head=$(git -C gates rev-parse HEAD 2>/dev/null || true)
            if [ -f gates/.github/workflows/rustbucket-gates.yml ]; then
              gates_has_workflow=true
            fi
          fi

          printf 'RUSTBUCKET-PROBE-CONTEXT {"job":%s,"workflow_ref":%s,"workflow_sha":%s,"env_workflow_ref":%s,"env_workflow_sha":%s,"repository":%s,"pr_head_sha":%s,"merge_sha":%s,"gates_checkout":%s,"gates_head":%s,"gates_has_workflow":%s,"image_os":%s,"image_version":%s,"runner_name":%s}\n' \
            "$(js "$PROBE_JOB")" "$(js "$CTX_WORKFLOW_REF")" "$(js "$CTX_WORKFLOW_SHA")" \
            "$(js "${GITHUB_WORKFLOW_REF:-}")" "$(js "${GITHUB_WORKFLOW_SHA:-}")" \
            "$(js "$CTX_REPOSITORY")" "$(js "$CTX_PR_HEAD_SHA")" "$(js "$CTX_SHA")" \
            "$(js "$GATES_OUTCOME")" "$(js "$gates_head")" "$gates_has_workflow" \
            "$(js "${ImageOS:-}")" "$(js "${ImageVersion:-}")" "$(js "${RUNNER_NAME:-}")"

          cpus=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || true)
          mem_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo 2>/dev/null || true)
          disk_mb=$(df -Pm . 2>/dev/null | awk 'NR==2 {print $4}')
          printf 'RUSTBUCKET-PROBE-TOOLS {"job":%s,"bash":%s,"git":%s,"jq":%s,"curl":%s,"rustup":%s,"cargo":%s,"rustc":%s,"python3":%s,"nproc":%s,"mem_total_kb":%s,"disk_free_mb":%s}\n' \
            "$(js "$PROBE_JOB")" "$(ver bash)" "$(ver git)" "$(ver jq)" "$(ver curl)" \
            "$(ver rustup)" "$(ver cargo)" "$(ver rustc)" "$(ver python3)" \
            "$(jn "$cpus")" "$(jn "$mem_kb")" "$(jn "$disk_mb")"

          status=pass
          findings=0
          if [ -f "project/probe/$PROBE_MARKER" ]; then
            printf 'RUSTBUCKET-GATE-REFUSAL {"v":1,"gate":"probe-%s","rule":"probe/marker","file":"probe/%s","line":1,"reason":"marker file present","fix":"delete probe/%s"}\n' \
              "$(esc "$PROBE_JOB")" "$(esc "$PROBE_MARKER")" "$(esc "$PROBE_MARKER")"
            status=refused
            findings=1
          fi
          if [ -n "${PROBE_ERROR_MARKER:-}" ] && [ -f "project/probe/$PROBE_ERROR_MARKER" ]; then
            status=error
          fi
          if [ -n "${PROBE_HANG_MARKER:-}" ] && [ -f "project/probe/$PROBE_HANG_MARKER" ]; then
            printf 'RUSTBUCKET-PROBE-NOTE {"note":"hang marker present: sleeping past the job timeout"}\n'
            sleep 600
          fi

          printf 'RUSTBUCKET-GATE-RESULT {"v":1,"gate":"probe-%s","job":%s,"status":%s,"findings":%s,"truncated":false,"gates_commit":%s}\n' \
            "$(esc "$PROBE_JOB")" "$(js "$PROBE_JOB")" "$(js "$status")" "$findings" "$(js "$gates_head")"
          [ "$status" = pass ]

